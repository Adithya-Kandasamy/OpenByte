<html lang="en">
<head>

  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --card: #161f35;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #10b981;
      --text: #f0f4ff;
      --muted: #8892a4;
      --border: rgba(255,255,255,0.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 4rem;
      background: rgba(10,15,30,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: all 0.3s;
    }

    .logo-link { text-decoration: none; display: flex; align-items: center; }
    .logo-svg { height: 56px; width: auto; }

    .ring-spin {
      animation: spin 20s linear infinite;
      transform-origin: 100px 35px;
    }
    .ring-spin-reverse {
      animation: spin-reverse 14s linear infinite;
      transform-origin: 100px 35px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--text); }

    .nav-cta {
      background: var(--accent) !important;
      color: var(--bg) !important;
      padding: 0.5rem 1.2rem !important;
      border-radius: 6px;
      font-weight: 600 !important;
      transition: background 0.2s !important;
      white-space: nowrap;
    }

    .nav-cta:hover {
      background: #00b8e0 !important;
      color: var(--bg) !important;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      transition: all 0.3s;
    }

    /* DONATION TRACKER */
    .donation-tracker {
      position: absolute;
      right: 0;
      top: 70px;
      bottom: 0;
      width: 42%;
      background: rgba(0,212,255,0.03);
      border-left: 1px solid rgba(0,212,255,0.12);
      border-top: 1px solid rgba(0,212,255,0.12);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    .tracker-tabs {
      display: flex;
      border-bottom: 1px solid rgba(0,212,255,0.15);
      background: rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .tracker-tab {
      flex: 1;
      padding: 1.2rem;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
      user-select: none;
    }

    .tracker-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(0,212,255,0.06);
    }

    .tracker-tab:hover:not(.active) {
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }

    .tracker-panel {
      display: none;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      padding: 2.5rem 3.5rem;
    }

    .tracker-panel.active { display: flex; }

    .tracker-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .tracker-amount {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 1.8rem;
    }

    .tracker-amount span { color: var(--accent); }

    .tracker-bar-wrap {
      background: rgba(255,255,255,0.07);
      border-radius: 100px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 0.8rem;
    }

    .tracker-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #00aaff, #00d4ff);
      transition: width 1.5s ease;
      width: 0%;
    }

    .tracker-goal {
      font-size: 0.88rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .tracker-live {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--accent3);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .tracker-live-dot {
      width: 6px; height: 6px;
      background: var(--accent3);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .tracker-error {
      font-size: 0.8rem;
      color: #f87171;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      margin-top: 1rem;
    }

    /* Leaderboard */
    .lb-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
